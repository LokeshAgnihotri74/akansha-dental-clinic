services:
  # Single Unified Full-Stack Service (Frontend UI + Backend API on 1 Single Live Link)
  - type: web
    name: akansha-dental-clinic
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLINIC_NAME
        value: "Akansha Dental Clinic & Implant Center"
      - key: CLINIC_PHONE
        value: "+91 8130 406 405"
      - key: CLINIC_EMAIL
        value: "support@akanshadental.com"
      # Real Managed Database Connection (Render PostgreSQL, Neon, Supabase, or Aiven MySQL)
      - key: DATABASE_URL
        sync: false
      # SMTP Email Configuration (Optional: Gmail, Brevo, Resend, or AWS SES)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
