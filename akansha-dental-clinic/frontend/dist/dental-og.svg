    </text>

    <!-- Pill 2 -->
    <rect x="280" width="280" height="48" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" />
    <text x="300" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">
      ⭐ NABH &amp; ISO 9001:2015
    </text>

    <!-- Pill 3 -->
    <rect x="580" width="240" height="48" rx="24" fill="url(#tealGrad)" />
    <text x="605" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#0A2540">
      📞 +91 8130 406 405
    </text>
